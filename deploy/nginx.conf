load_module modules/ngx_http_js_module.so;
env NOTEBOOK_ASSETS_LINK_SECRET;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr;

events {}

http {
    include /etc/nginx/mime.types;
    access_log off;
    js_import assets from /etc/nginx/assets.js;
    js_set $asset_authorized assets.authorized;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        client_max_body_size 0;

        location = /citation-assets/view {
            alias /etc/nginx/asset-viewer.html;
            default_type text/html;
            add_header Referrer-Policy no-referrer always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~* ^/citation-assets/files/(?<asset_path>.+\.pdf)$ {
            if ($asset_authorized = 0) { return 404; }
            alias /assets/$asset_path;
            disable_symlinks on from=/assets;
            add_header Access-Control-Allow-Origin "null" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range" always;
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /citation-assets/ { return 404; }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
    }
}
