[project]
name = "notebook-ib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-postgres>=0.0.16",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "pypdf>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0",
    "langchain-huggingface[full]>=1.2.3",
    "pyjwt[crypto]>=2.10",
    "openai>=1.66.2",
    "httpx>=0.27",
    "filelock>=3.16",
]

[project.optional-dependencies]
pdf-ocr = ["unstructured[pdf]>=0.18.0"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
