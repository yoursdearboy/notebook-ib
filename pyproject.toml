[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebook"]

[project]
name = "notebook-ib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-postgres>=0.0.16",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "pypdf>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.1",
    "sqlalchemy>=2.0",
    "langchain-huggingface[full]>=1.2.3",
    "langchain-openai>=1.8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.14",
]

[project.scripts]
notebook = "notebook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.17.5",
]
webui = [
    "open-webui>=0.8.8",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
]

[tool.uv]
override-dependencies = ["pyarrow==22.0.0"]

# CPU-only PyTorch on Linux; macOS wheels on PyPI are CPU-only already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' and python_version < '3.15'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
